<!DOCTYPE html>
<html lang="en" data-theme="historical-dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bound by Time</title>
    <meta name="description" content="Ewan.">

    <!-- CSS -->
    <link rel="stylesheet" href="./style.css">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- DaisyUI & Tailwind -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/daisyui@5" type="text/css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Script -->
    <script src="./script.js" defer></script>
</head>
<body class="historical-body overflow-hidden">
    <!-- ========== PRELOADER ========== -->
    <div id="preloader" class="preloader">
        <div class="preloader-content">
            <div class="preloader-book">
                <div class="preloader-page"></div>
                <div class="preloader-page"></div>
                <div class="preloader-page"></div>
            </div>
            <p class="preloader-text">Wait lang Ma'am</p>
        </div>
    </div>

    <!-- ========== AMBIENT BACKGROUND LAYERS ========== -->
    <div class="ambient-background" aria-hidden="true"></div>
    <div class="candle-glow" aria-hidden="true"></div>
    <div class="dust-particles" aria-hidden="true">
        <span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span><span></span>
    </div>
    <div class="table-surface" aria-hidden="true"></div>

    <!-- ========== TOP BAR ========== -->
    <header class="top-bar">
        <div class="top-bar-left">
            <span class="top-bar-title">Bound by Time</span>
        </div>
        <div class="top-actions">
            <button id="btn-toc" class="btn-ghost" aria-label="Open table of contents">
                <i class="bi bi-list-ul"></i> <span class="btn-label">Contents</span>
            </button>
            <button id="btn-mute" class="btn-ghost" aria-label="Mute/unmute ambient audio">
                <i class="bi bi-volume-up-fill"></i> <span class="btn-label">Sound</span>
            </button>
            <button id="btn-fullscreen" class="btn-ghost" aria-label="Toggle fullscreen">
                <i class="bi bi-arrows-fullscreen"></i> <span class="btn-label">Fullscreen</span>
            </button>
        </div>
    </header>

    <!-- ========== MAIN CONTENT ========== -->
    <main class="book-container" id="camera-viewport">
        <!-- =========================================================
        HISTORICAL DESK BACKGROUND
        ========================================================= -->
        <div class="desk-environment" aria-hidden="true">
            <!-- Warm light source -->
            <div class="desk-light"></div>

            <!-- Wooden surface -->
            <div class="desk-table"></div>

            <!-- Ambient light halo -->
            <div class="desk-light-halo"></div>

            <!-- Book shadow -->
            <div class="desk-book-shadow"></div>

            <!-- ==================== CLUTTER ==================== -->

            <!-- Left parchment -->
            <div class="desk-parchment parchment-left">
                <span>✦</span>
            </div>

            <!-- Right parchment -->
            <div class="desk-parchment parchment-right">
                <span>☙</span>
            </div>

            <!-- Ink bottle -->
            <div class="desk-inkwell">
                <div class="inkwell-neck"></div>
                <div class="inkwell-body"></div>
                <div class="inkwell-highlight"></div>
            </div>

            <!-- Quill -->
            <div class="desk-quill">
                <div class="quill-shaft"></div>
                <div class="quill-feather"></div>
            </div>

            <!-- Small closed book -->
            <div class="desk-small-book small-book-left">
                <div class="small-book-cover"></div>
                <div class="small-book-pages"></div>
            </div>

            <!-- Rolled scroll -->
            <div class="desk-scroll">
                <div class="scroll-body"></div>
                <div class="scroll-roll left"></div>
                <div class="scroll-roll right"></div>
            </div>

            <!-- Small candle -->
            <div class="desk-candle">
                <div class="candle-body"></div>
                <div class="candle-wick"></div>
                <div class="candle-flame"></div>
            </div>
        </div>
        <div class="book-wrapper" id="book-wrapper">
            <div class="book-shadow" aria-hidden="true"></div>

            <!-- ========== FLIP BOOK STRUCTURE ========== -->
            <div id="flip_book" role="document" aria-label="Historical flip book">

                <!-- ========== FRONT COVER ========== -->
                <div class="front_cover" id="front-cover-trigger">
                    <div class="cover-content">
                        <div class="cover-border">
                            <div class="cover-border-inner">
                                <span class="cover-ornament top-left">❦</span>
                                <span class="cover-ornament top-right">❦</span>
                                <span class="cover-ornament bottom-left">❦</span>
                                <span class="cover-ornament bottom-right">❦</span>
                                <h1 class="book-title">Bound by Time</h1>
                                <div class="title-rule"></div>
                                <p class="book-subtitle">Presented by</p>
                                <p class="book-author">Grade 12 - Raven</p>
                                <div class="cover-emblem">⚜</div>
                            </div>
                        </div>
                    </div>
                    <div class="ribbon-bookmark" aria-hidden="true"></div>
                    <div class="cover-edge-wear" aria-hidden="true"></div>
                    <div class="cover-texture" aria-hidden="true"></div>
                </div>

                <!-- ========== ACT PAGES MOUNT POINT ========== -->

                <!-- ========== BACK COVER ========== -->
                <div class="back_cover">
                    <div class="back-cover-content">
                        <span class="cover-ornament">❦</span>
                        <p class="end-text">The End</p>
                        <div class="back-cover-border"></div>
                    </div>
                    <div class="cover-texture" aria-hidden="true"></div>
                </div>

                <div class="page-stack" aria-hidden="true"></div>
            </div>
        </div>
    </main>

    <!-- ========== ACT PAGE / SCENE TEMPLATE ========== -->
    <template id="act-page-template">
        <div class="page act-page" data-act-index="">
            <div class="front_page">
                <div class="act-portal" data-act-target="">
                    <div class="scene-layer" aria-live="polite">

                        <!-- ===== SCENE 1 ===== -->
                        <article class="scene" data-scene-local="1" data-scene-global="" aria-hidden="true">
                            <div class="scene-media">
                                <img class="scene-image" src="./ResourceImages/A1S1.png" alt="Act 1, Scene 1" />
                                <div class="scene-image-placeholder" aria-hidden="true"></div>
                            </div>
                            <div class="scene-dialogue" aria-label="Scene 1 dialogue">
                                <div class="scene-dialogue-nameplate">Speaker Name</div>
                                <p class="scene-dialogue-text">Scene 1 dialogue placeholder...</p>
                                <div class="scene-dialogue-indicator" aria-hidden="true">
                                    <i class="bi bi-caret-down-fill"></i>
                                </div>
                            </div>
                        </article>

                        <!-- ===== SCENE 2 ===== -->
                        <article class="scene" data-scene-local="2" data-scene-global="" aria-hidden="true">
                            <div class="scene-media">
                                <img class="scene-image" src="./ResourceImages/A1S2.png" alt="Act 1, Scene 2" />
                                <div class="scene-image-placeholder" aria-hidden="true">Scene 2 Image</div>
                            </div>
                            <div class="scene-dialogue" aria-label="Scene 2 dialogue">
                                <div class="scene-dialogue-nameplate">Speaker Name</div>
                                <p class="scene-dialogue-text">Scene 2 dialogue placeholder...</p>
                                <div class="scene-dialogue-indicator" aria-hidden="true">
                                    <i class="bi bi-caret-down-fill"></i>
                                </div>
                            </div>
                        </article>

                        <!-- ===== SCENE 3 ===== -->
                        <article class="scene" data-scene-local="3" data-scene-global="" aria-hidden="true">
                            <div class="scene-media">
                                <img class="scene-image" src="./ResourceImages/A1S3.png" alt="Act 1, Scene 3" />
                                <div class="scene-image-placeholder" aria-hidden="true">Scene 3 Image</div>
                            </div>
                            <div class="scene-dialogue" aria-label="Scene 3 dialogue">
                                <div class="scene-dialogue-nameplate">Speaker Name</div>
                                <p class="scene-dialogue-text">Scene 3 dialogue placeholder...</p>
                                <div class="scene-dialogue-indicator" aria-hidden="true">
                                    <i class="bi bi-caret-down-fill"></i>
                                </div>
                            </div>
                        </article>

                        <!-- ===== SCENE 4 ===== -->
                        <article class="scene" data-scene-local="4" data-scene-global="" aria-hidden="true">
                            <div class="scene-media">
                                <img class="scene-image" src="./ResourceImages/A1S4.png" alt="Act 1, Scene 4" />
                                <div class="scene-image-placeholder" aria-hidden="true">Scene 4 Image</div>
                            </div>
                            <div class="scene-dialogue" aria-label="Scene 4 dialogue">
                                <div class="scene-dialogue-nameplate">Speaker Name</div>
                                <p class="scene-dialogue-text">Scene 4 dialogue placeholder...</p>
                                <div class="scene-dialogue-indicator" aria-hidden="true">
                                    <i class="bi bi-caret-down-fill"></i>
                                </div>
                            </div>
                        </article>

                        <!-- ===== SCENE 5 ===== -->
                        <article class="scene" data-scene-local="5" data-scene-global="" aria-hidden="true">
                            <div class="scene-media">
                                <img class="scene-image" src="./ResourceImages/A1S5.png" alt="Act 1, Scene 5" />
                                <div class="scene-image-placeholder" aria-hidden="true">Scene 5 Image</div>
                            </div>
                            <div class="scene-dialogue" aria-label="Scene 5 dialogue">
                                <div class="scene-dialogue-nameplate">Speaker Name</div>
                                <p class="scene-dialogue-text">Scene 5 dialogue placeholder...</p>
                                <div class="scene-dialogue-indicator" aria-hidden="true">
                                    <i class="bi bi-caret-down-fill"></i>
                                </div>
                            </div>
                        </article>

                        <!-- ===== SCENE 6 ===== -->
                        <article class="scene" data-scene-local="6" data-scene-global="" aria-hidden="true">
                            <div class="scene-media">
                                <img class="scene-image" src="./ResourceImages/A1S6.png" alt="Act 1, Scene 6" />
                                <div class="scene-image-placeholder" aria-hidden="true">Scene 6 Image</div>
                            </div>
                            <div class="scene-dialogue" aria-label="Scene 6 dialogue">
                                <div class="scene-dialogue-nameplate">Speaker Name</div>
                                <p class="scene-dialogue-text">Scene 6 dialogue placeholder...</p>
                                <div class="scene-dialogue-indicator" aria-hidden="true">
                                    <i class="bi bi-caret-down-fill"></i>
                                </div>
                            </div>
                        </article>

                        <!-- ===== SCENE 7 ===== -->
                        <article class="scene" data-scene-local="7" data-scene-global="" aria-hidden="true">
                            <div class="scene-media">
                                <img class="scene-image" src="./ResourceImages/A1S7.png" alt="Act 1, Scene 7" />
                                <div class="scene-image-placeholder" aria-hidden="true">Scene 7 Image</div>
                            </div>
                            <div class="scene-dialogue" aria-label="Scene 7 dialogue">
                                <div class="scene-dialogue-nameplate">Speaker Name</div>
                                <p class="scene-dialogue-text">Scene 7 dialogue placeholder...</p>
                                <div class="scene-dialogue-indicator" aria-hidden="true">
                                    <i class="bi bi-caret-down-fill"></i>
                                </div>
                            </div>
                        </article>

                        <!-- ===== SCENE 8 ===== -->
                        <article class="scene" data-scene-local="8" data-scene-global="" aria-hidden="true">
                            <div class="scene-media">
                                <img class="scene-image" src="./ResourceImages/A1S8.png" alt="Act 1, Scene 8" />
                                <div class="scene-image-placeholder" aria-hidden="true">Scene 8 Image</div>
                            </div>
                            <div class="scene-dialogue" aria-label="Scene 8 dialogue">
                                <div class="scene-dialogue-nameplate">Speaker Name</div>
                                <p class="scene-dialogue-text">Scene 8 dialogue placeholder...</p>
                                <div class="scene-dialogue-indicator" aria-hidden="true">
                                    <i class="bi bi-caret-down-fill"></i>
                                </div>
                            </div>
                        </article>

                        <!-- ===== SCENE 9 ===== -->
                        <article class="scene" data-scene-local="9" data-scene-global="" aria-hidden="true">
                            <div class="scene-media">
                                <img class="scene-image" src="./ResourceImages/A1S9.png" alt="Act 1, Scene 9" />
                                <div class="scene-image-placeholder" aria-hidden="true">Scene 9 Image</div>
                            </div>
                            <div class="scene-dialogue" aria-label="Scene 9 dialogue">
                                <div class="scene-dialogue-nameplate">Speaker Name</div>
                                <p class="scene-dialogue-text">Scene 9 dialogue placeholder...</p>
                                <div class="scene-dialogue-indicator" aria-hidden="true">
                                    <i class="bi bi-caret-down-fill"></i>
                                </div>
                            </div>
                        </article>

                    </div>
                </div>

                <div class="act-title-overlay">Act Title</div>
                <div class="edge_shading"></div>
            </div>

            <div class="back_page" aria-hidden="true">
                <div class="edge_shading"></div>
                <div class="parchment-texture"></div>
                <div class="act-transition-emblem">⚜</div>
            </div>
        </div>
    </template>

    <div id="dialogue-hud" class="dialogue-hud-container hidden" aria-hidden="true">
        <div class="dialogue-box-game">
            <div class="dialogue-nameplate" id="dialogue-speaker">Speaker Name</div>
            <p class="dialogue-text-content" id="dialogue-text">...</p>
            <div class="dialogue-continue-indicator">
                <i class="bi bi-caret-down-fill"></i>
            </div>
        </div>
    </div>

    <!-- ========== SCENE NAVIGATION ARROWS ========== -->
    <button id="nav-prev" class="nav-arrow prev" aria-label="Previous scene">
        <i class="bi bi-chevron-left"></i>
    </button>
    <button id="nav-next" class="nav-arrow next" aria-label="Next scene">
        <i class="bi bi-chevron-right"></i>
    </button>

    <!-- ========== BOTTOM PROGRESS BAR ========== -->
    <footer class="bottom-bar">
        <div class="progress-container">
            <div class="story-progress-text">
                <span id="act-indicator" class="act-indicator">Cover</span>
                <span id="scene-indicator" class="scene-indicator"></span>
            </div>
            <div class="progress-bar" role="progressbar" aria-valuemin="0" aria-valuemax="54" aria-valuenow="0">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
            <span class="progress-percent" id="progress-percent">0%</span>
        </div>
        <div class="audio-controls">
            <button id="btn-audio-toggle" class="btn-ghost" aria-label="Play/pause ambient audio">
                <i class="bi bi-play-fill"></i> <span class="btn-label">Ambient</span>
            </button>
            <div class="audio-visualizer" id="audio-visualizer" aria-hidden="true">
                <span></span><span></span><span></span><span></span><span></span>
            </div>
        </div>
        <div class="keyboard-hint">
            <i class="bi bi-keyboard"></i> <span>← → advance</span>
        </div>
    </footer>

    <!-- ========== TABLE OF CONTENTS MODAL ========== -->
    <dialog id="toc-modal" class="modal backdrop-blur-xl">
        <div class="modal-box historical-modal toc-modal-box">
            <div class="toc-header">
                <span class="toc-ornament">❦</span>
                <h2 class="toc-title">Story Index</h2>
                <span class="toc-ornament">❦</span>
            </div>
            <ul class="toc-list" id="toc-list-container">
            </ul>
            <button class="btn-close-modal" aria-label="Close table of contents">
                <i class="bi bi-x-lg"></i>
            </button>
        </div>
    </dialog>
</body>
</html>
